<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Star Tools - Berita</title>

<link rel="icon" type="image/png" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<meta property="og:image" content="https://www.stools.web.id/logo.jpg">
<meta name="twitter:image" content="https://www.stools.web.id/logo.jpg">

<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "WebSite",
 "name": "Star Tools",
 "url": "https://www.stools.web.id/",
 "image": "https://www.stools.web.id/logo.jpg"
}
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F1F5F9;
    color: #0F172A;
  }

  body.dark {
    background: #0B1120;
    color: #F1F5F9;
  }

  body.dark .card-modern,
  body.dark .app-header,
  body.dark .sidebar-nav,
  body.dark .alert-card {
    background: #111827;
    border-color: #1E293B;
  }

  body.dark .news-item {
    border-bottom-color: #1E293B;
  }

  body.dark .news-item p {
    color: #94A3B8;
  }

  body.dark .news-item .meta {
    color: #64748B;
  }

  body.dark .filter-select,
  body.dark .filter-input {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }

  body.dark .bottom-nav {
    background: #111827;
    border-top-color: #1E293B;
  }

  body.dark .footer-app {
    color: #94A3B8;
    border-top-color: #1E293B;
  }

  body.dark .badge-kategori {
    background: #1E3A5F;
    color: #60A5FA;
  }

  body.dark .badge-kategori.teknologi { background: #1E3A5F; color: #60A5FA; }
  body.dark .badge-kategori.kebijakan { background: #4B1E3A; color: #F472B6; }
  body.dark .badge-kategori.prestasi { background: #1E4B2A; color: #34D399; }
  body.dark .badge-kategori.beasiswa { background: #4B3A1E; color: #FBBF24; }
  body.dark .badge-kategori.digital { background: #1E3A4B; color: #22D3EE; }
  body.dark .badge-kategori.guru { background: #3A1E4B; color: #A78BFA; }
  body.dark .badge-kategori.internasional { background: #4B1E1E; color: #F87171; }
  body.dark .badge-kategori.inovasi { background: #1E4B4B; color: #2DD4BF; }

  .app-container {
    max-width: 560px;
    margin: 0 auto;
    background: #F1F5F9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body.dark .app-container {
    background: #0B1120;
  }

  .app-header {
    background: #FFFFFF;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #E2E8F0;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  body.dark .app-header {
    background: #111827;
    border-bottom-color: #1E293B;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .menu-icon {
    width: 40px;
    height: 40px;
    background: #F8FAFE;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid #E2E8F0;
  }

  body.dark .menu-icon {
    background: #1E293B;
    border-color: #334155;
  }

  .menu-icon svg {
    stroke: #0F172A;
  }

  body.dark .menu-icon svg {
    stroke: #F1F5F9;
  }

  .app-title {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #2563EB, #60A5FA);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .close-btn {
    width: 40px;
    height: 40px;
    background: rgba(0, 0, 0, 0.05);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    border: none;
  }

  body.dark .close-btn {
    background: rgba(255, 255, 255, 0.05);
  }

  .close-btn:active {
    transform: scale(0.92);
  }

  .close-btn svg {
    stroke: #0F172A;
    width: 22px;
    height: 22px;
  }

  body.dark .close-btn svg {
    stroke: #F1F5F9;
  }

  .sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    visibility: hidden;
    opacity: 0;
    transition: 0.25s;
  }

  .sidebar-overlay.active {
    visibility: visible;
    opacity: 1;
  }

  .sidebar-nav {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100%;
    background: #FFFFFF;
    z-index: 101;
    transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    padding: 70px 20px 30px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
  }

  .sidebar-nav.active {
    left: 0;
  }

  .sidebar-nav a {
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 500;
    border-radius: 18px;
    text-decoration: none;
    color: #0F172A;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  body.dark .sidebar-nav a {
    color: #F1F5F9;
  }

  .sidebar-nav a:active {
    background: #DBEAFE;
  }

  body.dark .sidebar-nav a:active {
    background: #1E293B;
  }

  .logout-link {
    margin-top: 20px;
    border-top: 1px solid #E2E8F0;
    padding-top: 16px;
  }

  body.dark .logout-link {
    border-top-color: #334155;
  }

  .logout-link a {
    color: #DC2626 !important;
  }

  .logout-link a svg {
    stroke: #DC2626;
  }

  .close-sidebar-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 30px;
  }

  .screen {
    padding: 16px 16px 30px;
    flex: 1;
  }

  .card-modern {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    border: 1px solid #E2E8F0;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== CUSTOM FILTER ===== */
  .filter-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .custom-select-wrapper {
    flex: 1;
    min-width: 110px;
    position: relative;
  }

  .custom-select-wrapper .selected {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    color: #0F172A;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }

  body.dark .custom-select-wrapper .selected {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }

  .custom-select-wrapper .selected svg {
    width: 16px;
    height: 16px;
    stroke: #94A3B8;
    transition: 0.2s;
  }

  .custom-select-wrapper .selected.active svg {
    transform: rotate(180deg);
  }

  .custom-select-wrapper .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 6px 0;
    z-index: 100;
    max-height: 200px;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  body.dark .custom-select-wrapper .dropdown {
    background: #1E293B;
    border-color: #334155;
  }

  .custom-select-wrapper .dropdown.open {
    display: block;
  }

  .custom-select-wrapper .dropdown .option {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: #0F172A;
    transition: 0.15s;
  }

  body.dark .custom-select-wrapper .dropdown .option {
    color: #F1F5F9;
  }

  .custom-select-wrapper .dropdown .option:hover {
    background: #F1F5F9;
  }

  body.dark .custom-select-wrapper .dropdown .option:hover {
    background: #334155;
  }

  .custom-select-wrapper .dropdown .option.active {
    background: #DBEAFE;
    color: #2563EB;
  }

  body.dark .custom-select-wrapper .dropdown .option.active {
    background: #1E3A5F;
    color: #60A5FA;
  }

  .filter-input {
    flex: 1;
    min-width: 110px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    color: #0F172A;
    font-size: 13px;
  }

  .filter-input:focus {
    outline: none;
    border-color: #2563EB;
  }

  body.dark .filter-input {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }

  .filter-input::placeholder {
    color: #94A3B8;
  }

  body.dark .filter-input::placeholder {
    color: #64748B;
  }

  /* ===== NEWS ITEMS ===== */
  .news-item {
    padding: 16px 0;
    border-bottom: 1px solid #E2E8F0;
  }

  .news-item:last-child {
    border-bottom: none;
  }

  .news-item h3 {
    font-size: 15px;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .news-item p {
    font-size: 13px;
    color: #64748B;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .news-item .meta-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .news-item .meta {
    font-size: 11px;
    color: #94A3B8;
  }

  .badge-kategori {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 12px;
    border-radius: 40px;
  }

  .badge-kategori.teknologi { background: #DBEAFE; color: #2563EB; }
  .badge-kategori.kebijakan { background: #FCE4EC; color: #D81B60; }
  .badge-kategori.prestasi { background: #E8F5E9; color: #2E7D32; }
  .badge-kategori.beasiswa { background: #FFF3E0; color: #E65100; }
  .badge-kategori.digital { background: #E0F7FA; color: #00838F; }
  .badge-kategori.guru { background: #F3E5F5; color: #6A1B9A; }
  .badge-kategori.internasional { background: #FFEBEE; color: #C62828; }
  .badge-kategori.inovasi { background: #E0F2F1; color: #00695C; }

  .news-item a {
    color: #2563EB;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: inline-block;
    margin-top: 2px;
  }

  .news-item a:active {
    opacity: 0.7;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    right: 0;
    background: #FFFFFF;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 12px 0;
    z-index: 50;
    border-top: 1px solid #E2E8F0;
  }

  body.dark .bottom-nav {
    background: #111827;
    border-top-color: #1E293B;
  }

  .bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: #94A3B8;
    font-size: 10px;
    cursor: pointer;
    transition: 0.2s;
    padding: 4px 12px;
    border-radius: 12px;
    background: transparent;
    border: none;
  }

  .bottom-nav .nav-item:active {
    transform: scale(0.95);
  }

  .bottom-nav svg {
    width: 22px;
    height: 22px;
    stroke: #94A3B8;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: 0.2s;
  }

  .bottom-nav .nav-item.active {
    color: #2563EB;
  }

  .bottom-nav .nav-item.active svg {
    stroke: #2563EB;
  }

  .footer-app {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: #64748B;
    border-top: 1px solid #E2E8F0;
    margin-bottom: 60px;
  }

  body.dark .footer-app {
    color: #94A3B8;
    border-top-color: #1E293B;
  }

  .empty-news {
    text-align: center;
    padding: 30px 0;
    color: #94A3B8;
    font-size: 14px;
  }

  /* ===== CUSTOM MODAL / ALERT ===== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }

  .modal-content {
    background: #FFFFFF;
    width: 300px;
    border-radius: 28px;
    padding: 24px 22px;
    text-align: center;
    border: 1px solid #E2E8F0;
    animation: modalPop 0.25s ease;
  }

  body.dark .modal-content {
    background: #111827;
    border-color: #1E293B;
  }

  @keyframes modalPop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-content .modal-icon {
    margin-bottom: 12px;
    display: flex;
    justify-content: center;
  }

  .modal-content .modal-icon svg {
    width: 48px;
    height: 48px;
    stroke: #0F172A;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  body.dark .modal-content .modal-icon svg {
    stroke: #F1F5F9;
  }

  .modal-content .modal-icon svg circle {
    stroke: #0F172A;
    fill: none;
    stroke-width: 2;
  }

  body.dark .modal-content .modal-icon svg circle {
    stroke: #F1F5F9;
  }

  .modal-content .modal-icon svg path {
    stroke: #0F172A;
    fill: none;
    stroke-width: 2;
  }

  body.dark .modal-content .modal-icon svg path {
    stroke: #F1F5F9;
  }

  .modal-content .modal-icon svg polyline {
    stroke: #0F172A;
    fill: none;
    stroke-width: 2;
  }

  body.dark .modal-content .modal-icon svg polyline {
    stroke: #F1F5F9;
  }

  .modal-content h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #0F172A;
  }

  body.dark .modal-content h3 {
    color: #F1F5F9;
  }

  .modal-content p {
    font-size: 14px;
    color: #64748B;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  body.dark .modal-content p {
    color: #94A3B8;
  }

  .btn-full {
    background: #2563EB;
    border: none;
    color: white;
    font-weight: 600;
    padding: 12px;
    border-radius: 40px;
    font-size: 14px;
    width: 100%;
    cursor: pointer;
  }

  .btn-full:active {
    transform: scale(0.97);
  }

  /* ===== Tampilan Laptop / PC ===== */
  @media (min-width: 900px) {
    body {
      background: linear-gradient(160deg, #EFF6FF 0%, #F8FAFE 60%);
      min-height: 100vh;
    }

    body.dark {
      background: linear-gradient(160deg, #0B1120 0%, #111827 60%);
    }

    .app-container {
      max-width: 720px;
      margin: 36px auto;
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      min-height: auto;
    }

    body.dark .app-container {
      background: #111827;
      border-color: #1E293B;
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .app-header {
      border-radius: 20px 20px 0 0;
      position: relative;
    }

    .screen {
      padding: 24px 24px 30px;
    }

    .card-modern {
      padding: 24px;
      border-radius: 20px;
    }

    .bottom-nav {
      max-width: 720px;
      border-radius: 0 0 20px 20px;
    }

    .sidebar-nav {
      border-radius: 0 20px 20px 0;
    }

    .modal-content {
      width: 340px;
      padding: 28px 26px;
      border-radius: 28px;
    }

    .news-item h3 {
      font-size: 16px;
    }

    .news-item p {
      font-size: 14px;
    }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="app-header">
    <div class="logo-area">
      <div class="menu-icon" onclick="openSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </div>
      <span class="app-title">Star Tools</span>
    </div>
    <button class="close-btn" onclick="goTo('index.html')" aria-label="Kembali ke Beranda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar-nav" id="sidebarNav">
    <div class="close-sidebar-icon" onclick="closeSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <a href="#" onclick="goTo('index.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Utama
    </a>
    <a href="#" onclick="goTo('berita.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg> Berita
    </a>
    <a href="#" onclick="goTo('premium.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Premium
    </a>
    <a href="#" onclick="goTo('akun.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Akun
    </a>
    <div class="logout-link">
      <a href="#" onclick="logoutAction()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Keluar
      </a>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div class="screen">

function toggleDropdown(wrapperId) {
  const wrapper = document.getElementById(wrapperId);

  const selected = wrapper.querySelector('.selected');

  document.querySelectorAll('.dropdown.open').forEach(function(el) {
    if (el.closest('.custom-select-wrapper').id !== wrapperId) {
      el.classList.remove('open');
      el.closest('.custom-select-wrapper').querySelector('.selected').classList.remove('active');
    }
  });

  dropdown.classList.toggle('open');
  selected.classList.toggle('active');
}

function pilihKategori(value, label) {
  kategoriFilter = value;

  const dropdown = document.getElementById('filterKategoriDropdown');
  dropdown.querySelectorAll('.option').forEach(function(el) {
    el.classList.toggle('active', el.dataset.value === value);
  });

  dropdown.classList.remove('open');
  document.getElementById('filterKategoriWrapper').querySelector('.selected').classList.remove('active');
  applyFilters();
}

// ======================== RENDER BERITA ========================
function renderBerita() {
  const container = document.getElementById('newsList');
  const searchFilter = document.getElementById('filterSearch').value.toLowerCase().trim();

  let filtered = beritaData.filter(function(item) {
    const matchKategori = kategoriFilter === 'all' || item.kategori === kategoriFilter;
    const matchSearch = !searchFilter ||
      item.judul.toLowerCase().includes(searchFilter) ||
      item.deskripsi.toLowerCase().includes(searchFilter);
    return matchKategori && matchSearch;
  });

  filtered.sort(function(a, b) {
    const dateA = new Date(a.tanggal);
    const dateB = new Date(b.tanggal);
    return sortFilter === 'new' ? dateB - dateA : dateA - dateB;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-news">Tidak ada berita yang ditemukan</div>';
    return;
  }

  const kategoriLabel = {
    'teknologi': 'Teknologi',
    'kebijakan': 'Kebijakan',
    'prestasi': 'Prestasi',
    'beasiswa': 'Beasiswa',
    'digital': 'Digitalisasi',
    'guru': 'Guru',
    'internasional': 'Internasional',
    'inovasi': 'Inovasi'
  };

  let html = '';
  filtered.forEach(function(item) {
    html += `
      <div class="news-item">
        <h3>${item.judul}</h3>
        <p>${item.deskripsi}</p>
        <div class="meta-wrap">
          <span class="badge-kategori ${item.kategori}">${kategoriLabel[item.kategori] || item.kategori}</span>
          <span class="meta">${item.tanggal} | ${item.sumber}</span>
        </div>
        <a href="${item.link}" target="_blank">Baca Selengkapnya →</a>
      </div>
    `;
  });

  container.innerHTML = html;
}
