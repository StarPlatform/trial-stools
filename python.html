function loadLocalProgress() {
  var storedDate = localStorage.getItem('pythonDate');
  if (storedDate === todayStr) {
    todayLimit = parseInt(localStorage.getItem('pythonLimit') || '0');
    var stored = localStorage.getItem('pythonOpened');
    if (stored) openedIndexes = JSON.parse(stored);
  } else {
    todayLimit = 0;
    openedIndexes = [];
    localStorage.setItem('pythonDate', todayStr);
    localStorage.setItem('pythonLimit', '0');
    localStorage.setItem('pythonOpened', '[]');
  }
}

function saveLocalProgress() {
  localStorage.setItem('pythonLimit', todayLimit);
  localStorage.setItem('pythonOpened', JSON.stringify(openedIndexes));
}

function updateUI() {
  var badge = document.getElementById('premiumStatusBadge');
  var limitSpan = document.getElementById('limitCounter');

  if (isPremium && premiumExpiry) {
    var now = Date.now();
    if (now > premiumExpiry) {
      isPremium = false;
      premiumExpiry = null;
      badge.innerText = 'Premium Habis';
      badge.className = 'premium-indicator warning';
      limitSpan.innerText = '0/2 Hari Ini';
      if (currentUser) {
        db.ref('users/' + currentUser.uid + '/premium/coding').set(false);
        db.ref('users/' + currentUser.uid + '/premium/coding_expiry').remove();
      }
      return;
    }

    var sisaHari = Math.ceil((premiumExpiry - now) / (1000 * 60 * 60 * 24));
    badge.innerText = 'Premium (' + sisaHari + ' hari)';
    badge.className = 'premium-indicator active';
    limitSpan.innerText = 'Tak Terbatas';
  } else if (isPremium) {
    badge.innerText = 'Premium Aktif';
    badge.className = 'premium-indicator active';
    limitSpan.innerText = 'Tak Terbatas';
  } else {
    badge.innerText = 'Akun Standar';
    badge.className = 'premium-indicator';
    limitSpan.innerText = todayLimit + '/2 Hari Ini';
  }
}

function renderBagian() {
  var container = document.getElementById('listBagianGrid');
  if (!container) return;
  container.innerHTML = '';

  var iconCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var iconLock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  var iconChevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  for (var i = 0; i < materiList.length; i++) {
    var isOpened = openedIndexes.includes(i);
    var isLocked = !isOpened && !isPremium && todayLimit >= 2;

    var rawTitle = materiList[i].judul;
    var dashIdx = rawTitle.indexOf(' - ');
    var shortTitle = dashIdx !== -1 ? rawTitle.substring(dashIdx + 3) : rawTitle;

    var btn = document.createElement('div');
    btn.className = 'materi-btn';
    if (isOpened) btn.classList.add('opened');
    if (isLocked) btn.classList.add('locked');

    var statusIcon = iconChevron;
    if (isOpened) statusIcon = iconCheck;
    else if (isLocked) statusIcon = iconLock;

    btn.innerHTML =
      '<div class="materi-num">' + (i + 1) + '</div>' +
      '<div class="materi-text">' +
        '<div class="materi-title">' + shortTitle + '</div>' +
        '<div class="materi-sub">Materi ' + (i + 1) + ' dari ' + materiList.length + '</div>' +
      '</div>' +
      '<div class="materi-status">' + statusIcon + '</div>';

    btn.onclick = (function(idx) {
      return function() { openMateri(idx); };
    })(i);

    container.appendChild(btn);
  }
}

function openMateri(index) {
  if (!currentUser) {
    showAlert('Silakan masuk ke akun Anda terlebih dahulu.', false);
    return;
  }

  db.ref('users/' + currentUser.uid + '/premium/coding').once('value').then(function(snap) {
    isPremium = snap.val() === true;
    return db.ref('users/' + currentUser.uid + '/premium/coding_expiry').once('value');
  }).then(function(expirySnap) {
    premiumExpiry = expirySnap.val() || null;

    if (isPremium && premiumExpiry && Date.now() > premiumExpiry) {
      isPremium = false;
      premiumExpiry = null;
      db.ref('users/' + currentUser.uid + '/premium/coding').set(false);
      db.ref('users/' + currentUser.uid + '/premium/coding_expiry').remove();
      updateUI();
      renderBagian();
      showAlert('Masa premium Anda telah berakhir. Silakan perpanjang untuk mengakses materi.', true);
      return;
    }

    var isOpened = openedIndexes.includes(index);
    var isLocked = !isOpened && !isPremium && todayLimit >= 2;

    if (isLocked) {
      showAlert('Batas harian untuk akun standar telah tercapai (2 materi). Dapatkan akses premium untuk membuka seluruh materi tanpa batas.', true);
      return;
    }

    if (!isOpened) {
      todayLimit++;
      openedIndexes.push(index);
      saveLocalProgress();
      updateUI();
      renderBagian();

      if (currentUser) {
        var openedObj = {};
        openedIndexes.forEach(function(i) { openedObj[i] = true; });
        db.ref('users/' + currentUser.uid + '/progress/python').set(openedObj);
        db.ref('users/' + currentUser.uid + '/limit/python').set({ count: todayLimit, date: todayStr });
      }
    }

    currentMateriIdx = index;

    document.getElementById('halamanUtama').classList.add('hidden');
    document.getElementById('materiView').classList.remove('hidden');

    document.getElementById('judulMateriView').innerHTML = materiList[index].judul;
    document.getElementById('isiMateriDetail').innerHTML = materiList[index].konten;
  });
}

function nextMateri() {
  if (currentMateriIdx + 1 < materiList.length) {
    openMateri(currentMateriIdx + 1);
  } else {
    showAlert('Anda telah mencapai materi terakhir dalam daftar.', false);
  }
}

function prevMateri() {
  if (currentMateriIdx - 1 >= 0) {
    openMateri(currentMateriIdx - 1);
  } else {
    showAlert('Ini adalah materi pertama.', false);
  }
}

function backToList() {
  document.getElementById('materiView').classList.add('hidden');
  document.getElementById('halamanUtama').classList.remove('hidden');
  renderBagian();
}

function showAlert(message, showUpgrade) {
  var overlay = document.getElementById('globalAlert');
  document.getElementById('alertMessage').innerText = message;
  var extraDiv = document.getElementById('alertExtraBtn');
  extraDiv.innerHTML = '';
  if (showUpgrade) {
    var btn = document.createElement('button');
    btn.className = 'btn-full';
    btn.innerText = 'Tingkatkan ke Premium';
    btn.style.marginTop = '12px';
    btn.onclick = function() { closeAlertGlobal(); goTo('premium.html'); };
    extraDiv.appendChild(btn);
  }
  overlay.style.display = 'flex';
}

function closeAlertGlobal() {
  document.getElementById('globalAlert').style.display = 'none';
}

function openSidebar() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('sidebarNav').classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('sidebarNav').classList.remove('active');
}

function goTo(page) {
  window.location.href = page;
}

function logoutAction() {
  if (confirm('Yakin ingin keluar?')) {
    firebase.auth().signOut().then(function() {
      window.location.href = 'login.html';
    });
  }
}

document.getElementById('prevBtn').onclick = prevMateri;
document.getElementById('nextBtn').onclick = nextMateri;
document.getElementById('backToListBtn').onclick = backToList;

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
}

window.addEventListener('DOMContentLoaded', function() {
  loadLocalProgress();

  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) {
      currentUser = null;
      isPremium = false;
      premiumExpiry = null;
      updateUI();
      renderBagian();
      return;
    }

    currentUser = user;

    db.ref('users/' + user.uid + '/premium/coding').once('value').then(function(snap) {
      isPremium = snap.val() === true;
      return db.ref('users/' + user.uid + '/premium/coding_expiry').once('value');
    }).then(function(expirySnap) {
      premiumExpiry = expirySnap.val() || null;

      if (isPremium && premiumExpiry) {
        var now = Date.now();
        if (now > premiumExpiry) {
          isPremium = false;
          premiumExpiry = null;
          db.ref('users/' + user.uid + '/premium/coding').set(false);
          db.ref('users/' + user.uid + '/premium/coding_expiry').remove();
        }
      }

      return db.ref('users/' + user.uid + '/progress/python').once('value');
    }).then(function(snap) {
      if (snap.val()) {
        var data = snap.val();
        var newOpened = Array.isArray(data) ? data : Object.keys(data).map(Number);
        if (JSON.stringify(newOpened) !== JSON.stringify(openedIndexes)) {
          openedIndexes = newOpened;
          saveLocalProgress();
        }
      }
      return db.ref('users/' + user.uid + '/limit/python').once('value');
    }).then(function(snap) {
      var limitData = snap.val();
      if (limitData && limitData.date === todayStr) {
        if (todayLimit !== limitData.count) todayLimit = limitData.count;
      } else {
        todayLimit = 0;
      }
      saveLocalProgress();
      updateUI();
      renderBagian();
    }).catch(function(e) {
      console.error(e);
      renderBagian();
    });
  });
});
</script>
