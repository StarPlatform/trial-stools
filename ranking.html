<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let currentUser = null;

// ==================== AUTH ====================
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    currentUser = user.uid;
  } else {
    showAlert('Harap Login', 'Silakan login terlebih dahulu.');
    setTimeout(() => window.location.href = 'login.html', 2000);
  }
});

// ==================== SIDEBAR ====================
function openSidebar() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('sidebarNav').classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('sidebarNav').classList.remove('active');
}

function goTo(page) {
  localStorage.setItem('targetPage', page);
  localStorage.setItem('activePage', page);
  window.location.href = page;
}

function logoutAction() {
  if (confirm('Yakin ingin keluar?')) {
    firebase.auth().signOut().then(() => {
      window.location.href = 'login.html';
    });
  }
}

function goBack() {
  window.location.href = 'index.html';
}

function goRapot() {
  window.location.href = 'rata.html';
}

// ==================== ALERT ====================
function showAlert(title, message, showUpgrade) {
  if (showUpgrade === undefined) showUpgrade = false;
  const overlay = document.getElementById('globalAlert');
  document.getElementById('alertTitle').innerText = title;
  document.getElementById('alertMessage').innerText = message;
  const extraDiv = document.getElementById('alertExtraBtn');
  extraDiv.innerHTML = '';
  if (showUpgrade) {
    const btn = document.createElement('button');
    btn.className = 'btn-modern primary';
    btn.innerText = 'Tingkatkan ke Premium';
    btn.style.marginTop = '12px';
    btn.onclick = function() { closeAlertGlobal(); goTo('premium.html'); };
    extraDiv.appendChild(btn);
  }
  overlay.style.display = 'flex';
}

function closeAlertGlobal() {
  document.getElementById('globalAlert').style.display = 'none';
}

// ==================== RANKING FUNCTIONS ====================

// TAMPIL RANKING
function tampilRanking() {
  let data = JSON.parse(localStorage.getItem('rankingData') || '[]');
  const tbody = document.getElementById('tabelRanking');
  
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="padding:20px; color:#94A3B8; text-align:center;">Belum ada data ranking</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map((d, i) => {
    let badge = '';
    let rankClass = '';
    if (i === 0) { badge = '🥇'; rankClass = 'rank-1'; }
    else if (i === 1) { badge = '🥈'; rankClass = 'rank-2'; }
    else if (i === 2) { badge = '🥉'; rankClass = 'rank-3'; }
    else { badge = (i + 1); }

    return `
      <tr>
        <td class="${rankClass}" style="font-weight:700;">${badge}</td>
        <td style="font-weight:500;">${d.nama}</td>
        <td style="font-weight:700;">${d.nilai.toFixed(2)}</td>
      </tr>
    `;
  }).join('');
}

// TAMBAH RANKING MANUAL
function tambahRankingManual() {
  const nama = document.getElementById('namaRankManual').value.trim();
  const nilai = parseFloat(document.getElementById('nilaiRankManual').value);

  if (!nama || isNaN(nilai)) {
    showAlert('Data Kurang', 'Harap isi nama dan nilai terlebih dahulu!');
    return;
  }

  let ranking = JSON.parse(localStorage.getItem('rankingData') || '[]');
  ranking.push({ nama, nilai });
  ranking.sort((a, b) => b.nilai - a.nilai);
  localStorage.setItem('rankingData', JSON.stringify(ranking));

  document.getElementById('namaRankManual').value = '';
  document.getElementById('nilaiRankManual').value = '';

  tampilRanking();
  showAlert('Berhasil', 'Data berhasil ditambahkan ke ranking!');
}

// RESET RANKING
function resetRanking() {
  if (!confirm('Yakin ingin menghapus semua data ranking?')) return;
  localStorage.removeItem('rankingData');
  tampilRanking();
  showAlert('Berhasil', 'Semua data ranking berhasil dihapus!');
}

// EXPORT PDF
function exportRankingPDF() {
  const data = JSON.parse(localStorage.getItem('rankingData') || '[]');
  if (data.length === 0) {
    showAlert('Kosong', 'Tidak ada data ranking untuk diexport.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.setTextColor(37, 99, 235);
  doc.text('Star Tools - Ranking Siswa', 14, 18);

  doc.setFontSize(11);
  doc.setTextColor(100, 116, 139);
  doc.text('Diexport: ' + new Date().toLocaleString('id-ID'), 14, 26);

  let y = 38;
  doc.setFontSize(12);
  doc.setTextColor(15, 23, 42);

  data.forEach((d, i) => {
    let rank = i + 1;
    let line = rank + '. ' + d.nama + ' - ' + d.nilai.toFixed(2);
    doc.text(line, 14, y);
    y += 10;
    if (y > 280) {
      doc.addPage();
      y = 20;
    }
  });

  doc.setFontSize(9);
  doc.setTextColor(148, 163, 184);
  doc.text('Star Platform | Star Tools 2026', 14, doc.internal.pageSize.height - 10);

  doc.save('Ranking_Siswa_Star_Tools.pdf');
  showAlert('Berhasil', 'File PDF berhasil didownload!');
}

// ==================== THEME ====================
if (localStorage.getItem('themeEkonomi') === 'dark') {
  document.body.classList.add('dark');
}

// ==================== AUTO LOAD ====================
document.addEventListener('DOMContentLoaded', function() {
  tampilRanking();
});

// ==================== EXPOSE GLOBAL ====================
window.openSidebar = openSidebar;
window.closeSidebar = closeSidebar;
window.goTo = goTo;
window.logoutAction = logoutAction;
window.goBack = goBack;
window.goRapot = goRapot;
window.tampilRanking = tampilRanking;
window.tambahRankingManual = tambahRankingManual;
window.resetRanking = resetRanking;
window.exportRankingPDF = exportRankingPDF;
window.showAlert = showAlert;
window.closeAlertGlobal = closeAlertGlobal;
</script>
