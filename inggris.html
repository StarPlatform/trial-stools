// ======================== PROGRESS LOCALSTORAGE ========================
function loadProgress() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    openedIndexes = JSON.parse(saved);
  } else {
    openedIndexes = [];
  }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(openedIndexes));
}

function getProgressCount() {
  return openedIndexes.length;
}

function isOpened(index) {
  return openedIndexes.includes(index);
}

function markAsOpened(index) {
  if (!openedIndexes.includes(index)) {
    openedIndexes.push(index);
    saveProgress();
    updateProgressUI();
  }
}

// ======================== UI FUNCTIONS ========================
function renderBagian() {
  const container = document.getElementById('listBagianGrid');
  if (!container) return;
  container.innerHTML = '';
  
  for (let i = 0; i < materiList.length; i++) {
    const btn = document.createElement('div');
    btn.className = 'materi-btn';
    btn.innerText = 'Bagian ' + (i + 1);
    
    if (isOpened(i)) {
      btn.classList.add('opened');
    }
    
    btn.onclick = (function(idx) {
      return function() { openMateri(idx); };
    })(i);
    
    container.appendChild(btn);
  }
  
  updateProgressUI();
}

function updateProgressUI() {
  const count = getProgressCount();
  const total = materiList.length;
  document.getElementById('progressCount').innerText = count;
  document.getElementById('totalCount').innerText = total;
}

function openMateri(index) {
  currentMateriIdx = index;
  markAsOpened(index);
  renderBagian();
  
  document.getElementById('halamanUtama').classList.add('hidden');
  document.getElementById('materiView').classList.remove('hidden');
  
  document.getElementById('judulMateriView').innerHTML = materiList[index].judul;
  document.getElementById('isiMateriDetail').innerHTML = materiList[index].konten;
}

function nextMateri() {
  if (currentMateriIdx + 1 < materiList.length) {
    openMateri(currentMateriIdx + 1);
  } else {
    showAlert('Anda telah mencapai materi terakhir dalam daftar.');
  }
}

function prevMateri() {
  if (currentMateriIdx - 1 >= 0) {
    openMateri(currentMateriIdx - 1);
  } else {
    showAlert('Ini adalah materi pertama.');
  }
}

function backToList() {
  document.getElementById('materiView').classList.add('hidden');
  document.getElementById('halamanUtama').classList.remove('hidden');
  renderBagian();
}

function balikKeBahasa() {
  window.location.href = 'bahasa.html';
}

function goTo(page) {
  window.location.href = page;
}

function openSidebar() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('sidebarNav').classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('sidebarNav').classList.remove('active');
}

function closeAlertGlobal() {
  document.getElementById('globalAlert').style.display = 'none';
}

function showAlert(message) {
  const overlay = document.getElementById('globalAlert');
  document.getElementById('alertMessage').innerText = message;
  overlay.style.display = 'flex';
}

function logoutAction() {
  firebase.auth().signOut().then(function() {
    window.location.href = 'login.html';
  });
}

document.getElementById('prevBtn').onclick = prevMateri;
document.getElementById('nextBtn').onclick = nextMateri;
document.getElementById('backToListBtn').onclick = backToList;

if (localStorage.getItem('themeEkonomi') === 'dark') {
  document.body.classList.add('dark');
}

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) {
    const isGuest = localStorage.getItem('isGuest') === 'true';
    if (!isGuest) {
      window.location.href = 'login.html';
    }
  }
});

window.addEventListener('DOMContentLoaded', function() {
  loadProgress();
  renderBagian();
});

window.openSidebar = openSidebar;
window.closeSidebar = closeSidebar;
window.goTo = goTo;
window.logoutAction = logoutAction;
window.closeAlertGlobal = closeAlertGlobal;
</script>
