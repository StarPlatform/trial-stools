function loadLocalProgress() {
  const storedDate = localStorage.getItem('ekonomiDate');
  if (storedDate === todayStr) {
    todayLimit = parseInt(localStorage.getItem('ekonomiLimit') || '0');
    const stored = localStorage.getItem('ekonomiOpened');
    if (stored) openedIndexes = JSON.parse(stored);
  } else {
    todayLimit = 0;
    openedIndexes = [];
    localStorage.setItem('ekonomiDate', todayStr);
    localStorage.setItem('ekonomiLimit', '0');
    localStorage.setItem('ekonomiOpened', '[]');
  }
}

function saveLocalProgress() {
  localStorage.setItem('ekonomiLimit', todayLimit);
  localStorage.setItem('ekonomiOpened', JSON.stringify(openedIndexes));
}

function updateUI() {
  const badge = document.getElementById('premiumStatusBadge');
  const limitSpan = document.getElementById('limitCounter');

  if (isPremium && premiumExpiry) {
    const now = Date.now();
    if (now > premiumExpiry) {
      isPremium = false;
      premiumExpiry = null;
      badge.innerText = 'Premium Habis';
      badge.className = 'premium-indicator warning';
      limitSpan.innerText = '0/2 Hari Ini';
      if (currentUser) {
        db.ref('users/' + currentUser.uid + '/premium/ekonomi').set(false);
        db.ref('users/' + currentUser.uid + '/premium/ekonomi_expiry').remove();
      }
      return;
    }

    const sisaHari = Math.ceil((premiumExpiry - now) / (1000 * 60 * 60 * 24));
    badge.innerText = 'Premium (' + sisaHari + ' hari)';
    badge.className = 'premium-indicator active';
    limitSpan.innerText = 'Tak Terbatas';
  } else if (isPremium) {
    badge.innerText = 'Premium Aktif';
    badge.className = 'premium-indicator active';
    limitSpan.innerText = 'Tak Terbatas';
  } else {
    badge.innerText = 'Akun Standar';
    badge.className = 'premium-indicator';
    limitSpan.innerText = todayLimit + '/2 Hari Ini';
  }
}

function renderBagian() {
  const container = document.getElementById('listBagianGrid');
  if (!container) return;
  container.innerHTML = '';

  const iconCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const iconLock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const iconChevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  for (let i = 0; i < materiList.length; i++) {
    const isOpened = openedIndexes.includes(i);
    const isLocked = !isOpened && !isPremium && todayLimit >= 2;

    const rawTitle = materiList[i].judul;
    const dashIdx = rawTitle.indexOf(' - ');
    const shortTitle = dashIdx !== -1 ? rawTitle.substring(dashIdx + 3) : rawTitle;

    const btn = document.createElement('div');
    btn.className = 'materi-btn';
    if (isOpened) btn.classList.add('opened');
    if (isLocked) btn.classList.add('locked');

    let statusIcon = iconChevron;
    if (isOpened) statusIcon = iconCheck;
    else if (isLocked) statusIcon = iconLock;

    btn.innerHTML =
      '<div class="materi-num">' + (i + 1) + '</div>' +
      '<div class="materi-text">' +
        '<div class="materi-title">' + shortTitle + '</div>' +
        '<div class="materi-sub">Materi ' + (i + 1) + ' dari ' + materiList.length + '</div>' +
      '</div>' +
      '<div class="materi-status">' + statusIcon + '</div>';

    btn.onclick = (function(idx) {
      return function() { openMateri(idx); };
    })(i);

    container.appendChild(btn);
  }
}

function openMateri(index) {
  if (!currentUser) {
    showAlert('Silakan masuk ke akun Anda terlebih dahulu.', false);
    return;
  }

  db.ref('users/' + currentUser.uid + '/premium/ekonomi').once('value').then(function(snap) {
    isPremium = snap.val() === true;
    return db.ref('users/' + currentUser.uid + '/premium/ekonomi_expiry').once('value');
  }).then(function(expirySnap) {
    premiumExpiry = expirySnap.val() || null;

    if (isPremium && premiumExpiry && Date.now() > premiumExpiry) {
      isPremium = false;
      premiumExpiry = null;
      db.ref('users/' + currentUser.uid + '/premium/ekonomi').set(false);
      db.ref('users/' + currentUser.uid + '/premium/ekonomi_expiry').remove();
      updateUI();
      renderBagian();
      showAlert('Masa premium Anda telah berakhir. Silakan perpanjang untuk mengakses materi.', true);
      return;
    }

    const isOpened = openedIndexes.includes(index);
    const isLocked = !isOpened && !isPremium && todayLimit >= 2;

    if (isLocked) {
      showAlert('Batas harian untuk akun standar telah tercapai (2 materi). Dapatkan akses premium untuk membuka seluruh materi tanpa batas.', true);
      return;
    }

    if (!isOpened) {
      todayLimit++;
      openedIndexes.push(index);
      saveLocalProgress();
      updateUI();
      renderBagian();

      if (currentUser) {
        const openedObj = {};
        openedIndexes.forEach(function(i) { openedObj[i] = true; });
        db.ref('users/' + currentUser.uid + '/progress/ekonomi').set(openedObj);
        db.ref('users/' + currentUser.uid + '/limit/ekonomi').set({ count: todayLimit, date: todayStr });
      }
    }

    currentMateriIdx = index;

    document.getElementById('halamanUtama').classList.add('hidden');
    document.getElementById('materiView').classList.remove('hidden');

    document.getElementById('judulMateriView').innerHTML = materiList[index].judul;
    document.getElementById('isiMateriDetail').innerHTML = materiList[index].konten;
  });
}

function nextMateri() {
  if (currentMateriIdx + 1 < materiList.length) {
    openMateri(currentMateriIdx + 1);
  } else {
    showAlert('Anda telah mencapai materi terakhir dalam daftar.', false);
  }
}

function prevMateri() {
  if (currentMateriIdx - 1 >= 0) {
    openMateri(currentMateriIdx - 1);
  } else {
    showAlert('Ini adalah materi pertama.', false);
  }
}

function backToList() {
  document.getElementById('materiView').classList.add('hidden');
  document.getElementById('halamanUtama').classList.remove('hidden');
  renderBagian();
}

function showAlert(message, showUpgrade) {
  const overlay = document.getElementById('globalAlert');
  document.getElementById('alertMessage').innerText = message;
  const extraDiv = document.getElementById('alertExtraBtn');
  extraDiv.innerHTML = '';
  if (showUpgrade) {
    const btn = document.createElement('button');
    btn.className = 'btn-full';
    btn.innerText = 'Tingkatkan ke Premium';
    btn.style.marginTop = '12px';
    btn.onclick = function() { closeAlertGlobal(); goTo('premium.html'); };
    extraDiv.appendChild(btn);
  }
  overlay.style.display = 'flex';
}

function closeAlertGlobal() {
  document.getElementById('globalAlert').style.display = 'none';
}

function openSidebar() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('sidebarNav').classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('sidebarNav').classList.remove('active');
}

function goTo(page) {
  window.location.href = page;
}

function logoutAction() {
  if (confirm('Yakin ingin keluar?')) {
    firebase.auth().signOut().then(function() {
      window.location.href = 'login.html';
    });
  }
}

document.getElementById('prevBtn').onclick = prevMateri;
document.getElementById('nextBtn').onclick = nextMateri;
document.getElementById('backToListBtn').onclick = backToList;

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
}

window.addEventListener('DOMContentLoaded', function() {
  loadLocalProgress();

  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) {
      currentUser = null;
      isPremium = false;
      premiumExpiry = null;
      updateUI();
      renderBagian();
      return;
    }

    currentUser = user;

    db.ref('users/' + user.uid + '/premium/ekonomi').once('value').then(function(snap) {
      isPremium = snap.val() === true;
      return db.ref('users/' + user.uid + '/premium/ekonomi_expiry').once('value');
    }).then(function(expirySnap) {
      premiumExpiry = expirySnap.val() || null;

      if (isPremium && premiumExpiry) {
        const now = Date.now();
        if (now > premiumExpiry) {
          isPremium = false;
          premiumExpiry = null;
          db.ref('users/' + user.uid + '/premium/ekonomi').set(false);
          db.ref('users/' + user.uid + '/premium/ekonomi_expiry').remove();
        }
      }

      return db.ref('users/' + user.uid + '/progress/ekonomi').once('value');
    }).then(function(snap) {
      if (snap.val()) {
        const data = snap.val();
        const newOpened = Array.isArray(data) ? data : Object.keys(data).map(Number);
        if (JSON.stringify(newOpened) !== JSON.stringify(openedIndexes)) {
          openedIndexes = newOpened;
          saveLocalProgress();
        }
      }
      return db.ref('users/' + user.uid + '/limit/ekonomi').once('value');
    }).then(function(snap) {
      const limitData = snap.val();
      if (limitData && limitData.date === todayStr) {
        if (todayLimit !== limitData.count) todayLimit = limitData.count;
      } else {
        todayLimit = 0;
      }
      saveLocalProgress();
      updateUI();
      renderBagian();
    }).catch(function(e) {
      console.error(e);
      renderBagian();
    });
  });
});
</script>
