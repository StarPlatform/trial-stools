<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lihat Absensi - Star Tools</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F1F5F9;
    color: #0F172A;
  }
  body.dark { background:#0B1120; color:#F1F5F9; }

  .app-container {
    max-width: 560px;
    margin: 0 auto;
    background: #F1F5F9;
    min-height: 100vh;
  }
  body.dark .app-container { background:#0B1120; }

  .header-brand {
    background: linear-gradient(135deg, #2563EB, #3B82F6);
    padding: 22px 20px 26px;
    color: #fff;
    text-align: center;
  }
  .header-brand .logo-mini {
    display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,0.15); padding:5px 12px; border-radius:20px; margin-bottom:14px;
  }
  .header-brand h1 { font-size:19px; font-weight:800; margin-bottom:2px; }
  .header-brand p { font-size:12.5px; opacity:0.9; }

  .live-badge {
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.18);
    padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; margin-top:12px;
  }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#4ADE80; animation:pulseDot 1.5s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .container {
    background:#FFFFFF;
    margin:14px 16px;
    border-radius:16px;
    padding:16px;
    border:1px solid #E2E8F0;
  }
  body.dark .container { background:#111827; border-color:#1E293B; }

  .select-box {
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid #E2E8F0;
    background:#F8FAFE; font-size:14px; color:#0F172A; font-family:inherit;
  }
  body.dark .select-box { background:#1E293B; border-color:#334155; color:#F1F5F9; }

  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .stat-box { text-align:center; padding:10px 4px; border-radius:12px; background:#F8FAFE; }
  body.dark .stat-box { background:#1E293B; }
  .stat-box .num { font-size:17px; font-weight:800; }
  .stat-box .lbl { font-size:10px; color:#64748B; margin-top:2px; }
  body.dark .stat-box .lbl { color:#94A3B8; }
  .stat-box.hadir .num { color:#059669; }
  .stat-box.izin .num { color:#D97706; }
  .stat-box.sakit .num { color:#B45309; }
  .stat-box.alpa .num { color:#DC2626; }

  .absen-list { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .absen-row {
    display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
    border-radius:12px; border:1px solid #E2E8F0;
  }
  body.dark .absen-row { border-color:#1E293B; }
  .absen-row .tgl { font-size:13px; font-weight:600; }
  .status-pill { font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-pill.hadir { background:#DCFCE7; color:#059669; }
  .status-pill.izin { background:#FFEDD5; color:#D97706; }
  .status-pill.sakit { background:#FEF9C3; color:#B45309; }
  .status-pill.alpa { background:#FEE2E2; color:#DC2626; }
  .status-pill.belum { background:#F1F5F9; color:#94A3B8; }
  body.dark .status-pill.belum { background:#1E293B; color:#64748B; }

  .empty-state, .error-state { text-align:center; padding:40px 20px; color:#94A3B8; font-size:13px; }
  .error-state svg { width:40px; height:40px; stroke:#DC2626; margin-bottom:12px; }

  .footer-note {
    text-align:center; padding:20px; color:#94A3B8; font-size:11px; line-height:1.6;
  }

  .loading-spin {
    width:28px; height:28px; border:3px solid #E2E8F0; border-top-color:#2563EB;
    border-radius:50%; animation:spin 0.7s linear infinite; margin:30px auto;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (min-width: 900px) {
    body {
      background: linear-gradient(160deg, #EFF6FF 0%, #F8FAFE 60%);
      min-height: 100vh;
    }
    body.dark {
      background: linear-gradient(160deg, #0B1120 0%, #111827 60%);
    }
    .app-container {
      max-width: 640px;
      margin: 36px auto;
      min-height: auto;
      background: #F1F5F9;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      padding-bottom: 24px;
    }
    body.dark .app-container {
      background: #0B1120;
      border-color: #1E293B;
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header-brand { border-radius: 20px 20px 0 0; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header-brand">
    <div class="logo-mini">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Star Tools
    </div>
    <h1 id="namaMuridHeader">Memuat...</h1>
    <p id="namaKelasHeader">-</p>
    <div class="live-badge"><span class="live-dot"></span> Update Real-Time</div>
  </div>

  <div id="kontenUtama">
    <div class="loading-spin"></div>
  </div>

  <div class="footer-note">
    Halaman ini hanya bisa dilihat, tidak bisa diubah.<br>
    Star Platform | Star Tools 2026
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.database();

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

var kelasId = getParam("kelas");
var namaMurid = getParam("nama");

var BULAN_LIST = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var bulanDipilih = new Date().toLocaleString("id-ID", { month: "long" });

function daysInMonth(namaBulan) {
  var idx = BULAN_LIST.indexOf(namaBulan);
  var now = new Date();
  return new Date(now.getFullYear(), idx + 1, 0).getDate();
}

function renderError(msg) {
  document.getElementById("namaMuridHeader").innerText = "Tidak Ditemukan";
  document.getElementById("namaKelasHeader").innerText = "-";
  document.getElementById("kontenUtama").innerHTML =
    '<div class="error-state">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
    '<div>' + msg + '</div></div>';
}

function renderKonten() {
  var container = document.getElementById("kontenUtama");
  var totalHari = daysInMonth(bulanDipilih);

  var html = '<div class="container">';
  html += '<select class="select-box" id="pilihBulanView" onchange="gantiBulan(this.value)">';
  BULAN_LIST.forEach(function(b) {
    html += '<option value="' + b + '"' + (b === bulanDipilih ? ' selected' : '') + '>' + b + '</option>';
  });
  html += '</select>';

  html += '<div class="stat-grid">' +
    '<div class="stat-box hadir"><div class="num" id="statHadir">0</div><div class="lbl">Hadir</div></div>' +
    '<div class="stat-box izin"><div class="num" id="statIzin">0</div><div class="lbl">Izin</div></div>' +
    '<div class="stat-box sakit"><div class="num" id="statSakit">0</div><div class="lbl">Sakit</div></div>' +
    '<div class="stat-box alpa"><div class="num" id="statAlpa">0</div><div class="lbl">Alpa</div></div>' +
  '</div>';

  html += '<div class="absen-list" id="absenList"></div>';
  html += '</div>';

  container.innerHTML = html;
  renderTanggalList(totalHari, {});
}

function renderTanggalList(totalHari, dataAbsen) {
  var list = document.getElementById("absenList");
  if (!list) return;

  var hitung = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };
  var html = "";

  for (var i = 1; i <= totalHari; i++) {
    var rec = dataAbsen[i];
    var status = rec ? rec.status : null;
    var pillClass = "belum";
    var label = "Belum ada data";

    if (status === "Hadir") { pillClass = "hadir"; label = "Hadir"; hitung.Hadir++; }
    else if (status === "Izin") { pillClass = "izin"; label = "Izin"; hitung.Izin++; }
    else if (status === "Sakit") { pillClass = "sakit"; label = "Sakit"; hitung.Sakit++; }
    else if (status === "Alpa") { pillClass = "alpa"; label = "Alpa"; hitung.Alpa++; }

    html += '<div class="absen-row"><span class="tgl">Tanggal ' + i + '</span><span class="status-pill ' + pillClass + '">' + label + '</span></div>';
  }

  list.innerHTML = html;

  var statHadir = document.getElementById("statHadir");
  if (statHadir) {
    document.getElementById("statHadir").innerText = hitung.Hadir;
    document.getElementById("statIzin").innerText = hitung.Izin;
    document.getElementById("statSakit").innerText = hitung.Sakit;
    document.getElementById("statAlpa").innerText = hitung.Alpa;
  }
}

var absenRef = null;

function pasangListener() {
  if (absenRef) absenRef.off();

  absenRef = db.ref("kelas/" + kelasId + "/siswa/" + namaMurid + "/absen/" + bulanDipilih);
  absenRef.on("value", function(snap) {
    var dataAbsen = snap.val() || {};
    var totalHari = daysInMonth(bulanDipilih);
    renderTanggalList(totalHari, dataAbsen);
  });
}

function gantiBulan(bulan) {
  bulanDipilih = bulan;
  var totalHari = daysInMonth(bulanDipilih);
  renderTanggalList(totalHari, {});
  pasangListener();
}

window.addEventListener("DOMContentLoaded", function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }

  if (!kelasId || !namaMurid) {
    renderError("Link tidak valid. Pastikan link yang dibuka lengkap dan benar.");
    return;
  }

  db.ref("kelas/" + kelasId).once("value").then(function(snap) {
    if (!snap.exists()) {
      renderError("Kelas tidak ditemukan.");
      return;
    }
    var kelasData = snap.val();
    if (!kelasData.siswa || !kelasData.siswa[namaMurid]) {
      renderError("Murid tidak ditemukan di kelas ini.");
      return;
    }

    document.getElementById("namaMuridHeader").innerText = namaMurid;
    document.getElementById("namaKelasHeader").innerText = "Kelas " + kelasData.nama;

    renderKonten();
    pasangListener();
  }).catch(function() {
    renderError("Gagal memuat data. Coba periksa koneksi internet kamu.");
  });
});
</script>
</body>
</html>
